name: Windows installation

on:
  push:
    paths:
      - '**.cs'
      - '*.csproj'
      - 'nuget.config'
      - '*.ps1'
      - 'tests/**'
      - '.github/workflows/windows-install.yml'
  pull_request:
    paths:
      - '**.cs'
      - '*.csproj'
      - 'nuget.config'
      - '*.ps1'
      - 'tests/**'
      - '.github/workflows/windows-install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      LEANN_FORCE_CPU: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Installer failure-path regression tests
        shell: powershell
        run: .\tests\Test-Installer.ps1
      - name: Install, index, search, reinstall and roll back
        shell: powershell
        run: .\tests\Test-Installer-Windows.ps1
      - name: Collect installation evidence
        if: always()
        shell: powershell
        run: |
          $evidencePath = Join-Path $env:RUNNER_TEMP 'session-memory-install-evidence'
          New-Item -ItemType Directory -Force -Path $evidencePath | Out-Null
          $reportPath = Join-Path $env:RUNNER_TEMP 'session-memory-install-report.json'
          if (Test-Path $reportPath) { Copy-Item -LiteralPath $reportPath -Destination $evidencePath }
          $logsPath = Join-Path $env:LOCALAPPDATA 'LeannSessionMemory\logs'
          if (Test-Path $logsPath) { Copy-Item -LiteralPath $logsPath -Destination (Join-Path $evidencePath 'logs') -Recurse }
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: installation-${{ matrix.os }}
          path: ${{ runner.temp }}/session-memory-install-evidence/
          if-no-files-found: warn
