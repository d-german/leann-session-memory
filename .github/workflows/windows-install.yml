name: Windows installation

on:
  push:
    paths:
      - '**.cs'
      - '*.csproj'
      - 'nuget.config'
      - '*.ps1'
      - 'tests/**'
      - '.github/workflows/windows-install.yml'
  pull_request:
    paths:
      - '**.cs'
      - '*.csproj'
      - 'nuget.config'
      - '*.ps1'
      - 'tests/**'
      - '.github/workflows/windows-install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      LEANN_FORCE_CPU: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Installer failure-path regression tests
        shell: powershell
        run: .\tests\Test-Installer.ps1
      - name: Install, index, search, reinstall and roll back
        shell: powershell
        run: .\tests\Test-Installer-Windows.ps1
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installation-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/session-memory-install-report.json
            ~/AppData/Local/LeannSessionMemory/logs/
          if-no-files-found: warn
